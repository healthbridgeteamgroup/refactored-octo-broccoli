<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Health Bridge Team</title><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><img src="assets/health-bridge-logo.jpg"></a></div></header><main><section class="page-hero"><div class="container"><div class="eyebrow">ADMINISTRATION</div><h1>Membership Applications</h1></div></section><section class="section"><div class="container"><div id="adminMessage" class="notice">Loading...</div><div id="applications"></div></div></section></main><script>async function load(){let r=await fetch('/api/admin/applications');let d=await r.json();if(!r.ok){adminMessage.textContent=d.error;return}adminMessage.style.display='none';applications.innerHTML=d.applications.map(a=>`<article class="card" style="margin-bottom:20px"><h3>${a.first_name} ${a.last_name}</h3><p>${a.email} · ${a.profession||''} · ${a.country||''}</p><p><b>Status:</b> ${a.application_status}</p><p><b>Interests:</b> ${a.interests||''}</p><p><b>Motivation:</b> ${a.motivation}</p><textarea id="n${a.id}" placeholder="Admin note">${a.admin_note||''}</textarea><br><button class="btn primary" onclick="up(${a.id},'approved')">Approve</button> <button class="btn secondary" onclick="up(${a.id},'rejected')">Reject</button> <button class="btn secondary" onclick="up(${a.id},'pending')">Pending</button></article>`).join('')||'<div class="notice">No applications.</div>'}async function up(id,status){let r=await fetch('/api/admin/applications',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({id,status,admin_note:document.getElementById('n'+id).value})});if(r.ok)load();else alert((await r.json()).error)}load()</script></body></html>
